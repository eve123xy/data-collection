[project]
name = "llmpowerlaws-mainruns"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=0.24",
    "numpy>=1.26",
    "pandas>=2.2",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "google-api-python-client>=2.199.0",
    "google-auth>=2.57.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "matplotlib>=3.8", "jupyter>=1.0", "nbconvert>=7.0", "ipykernel>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
